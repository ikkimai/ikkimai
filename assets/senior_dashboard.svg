, 0.015)" stroke-width="1" />\n<line x1="0" y1="0" x2="900" y2="0" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />\n<line x1="0" y1="45" x2="900" y2="45" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />\n<line x1="0" y1="90" x2="900" y2="90" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />\n<line x1="0" y1="135" x2="900" y2="135" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />\n<line x1="0" y1="180" x2="900" y2="180" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />\n<line x1="0" y1="225" x2="900" y2="225" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />\n<line x1="0" y1="270" x2="900" y2="270" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />\n<line x1="0" y1="315" x2="900" y2="315" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />\n<line x1="0" y1="360" x2="900" y2="360" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />\n<line x1="0" y1="405" x2="900" y2="405" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />\n<line x1="0" y1="450" x2="900" y2="450" stroke="rgba(255, 255, 255, 0.015)" stroke-width="1" />\n
