<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1440 900" width="1440" height="900" fill="none">
  <defs>
    <style>

    .text-title { font-family: system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif; font-size: 56px; font-weight: 800; fill: #FFFFFF; letter-spacing: -1px; }
    .text-subtitle { font-family: system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif; font-size: 24px; font-weight: 500; fill: #A1A1AA; }
    
    .text-section { font-family: system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif; font-size: 16px; font-weight: 600; fill: #71717A; letter-spacing: 2px; text-transform: uppercase; }
    
    .metric-value { font-family: system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif; font-size: 48px; font-weight: 800; fill: #FFFFFF; letter-spacing: -1px; }
    .metric-label { font-family: system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif; font-size: 16px; font-weight: 500; fill: #A1A1AA; }
    
    .proj-title { font-family: system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif; font-size: 24px; font-weight: 600; fill: #FFFFFF; }
    .proj-desc { font-family: system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif; font-size: 16px; font-weight: 400; fill: #A1A1AA; line-height: 1.5; }
    
    .lang-name { font-family: system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif; font-size: 16px; font-weight: 500; fill: #E4E4E7; }
    .lang-pct { font-family: system-ui, -apple-system, 'SF Pro Display', 'Inter', 'Helvetica Neue', sans-serif; font-size: 14px; font-weight: 500; fill: #71717A; }

    @keyframes fadeIn {
      0% { opacity: 0; transform: translateY(10px); }
      100% { opacity: 1; transform: translateY(0); }
    }
    @keyframes slideRight {
      0% { width: 0; }
      100% { }
    }
    @keyframes pulseSoft {
      0% { opacity: 0.8; }
      50% { opacity: 1; filter: drop-shadow(0 0 15px rgba(99, 102, 241, 0.4)); }
      100% { opacity: 0.8; }
    }
    @keyframes orbit {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    
    .anim-fade { animation: fadeIn 1s cubic-bezier(0.16, 1, 0.3, 1) forwards; opacity: 0; }
    .anim-bar { animation: slideRight 1.5s cubic-bezier(0.16, 1, 0.3, 1) forwards; }
    .anim-pulse { animation: pulseSoft 4s infinite alternate; }
  
    </style>
    
      <linearGradient id="premium-border" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
        <stop offset="100%" stop-color="rgba(255,255,255,0.01)" />
      </linearGradient>
    
    
      <linearGradient id="card-bg" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="rgba(20,20,24,0.7)" />
        <stop offset="100%" stop-color="rgba(10,10,12,0.9)" />
