<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 280" width="800" height="280" fill="none">
  <defs>
    <style>

    .reactor-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', 'Roboto', 'Helvetica Neue', sans-serif; font-size: 18px; font-weight: 700; fill: #f8fafc; letter-spacing: 2px; }
    .reactor-sub { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; font-size: 11px; fill: #64748b; letter-spacing: 1px; }
    .lang-name { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', 'Roboto', 'Helvetica Neue', sans-serif; font-size: 13px; font-weight: 700; fill: #f8fafc; }
    .lang-pct { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; font-size: 13px; font-weight: 700; }
    
    @keyframes spinCW {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    @keyframes spinCCW {
      0% { transform: rotate(360deg); }
      100% { transform: rotate(0deg); }
    }
    .ring-1 { transform-origin: 160px 150px; animation: spinCW 25s linear infinite; }
    .ring-2 { transform-origin: 160px 150px; animation: spinCCW 35s linear infinite; }
    .ring-3 { transform-origin: 160px 150px; animation: spinCW 45s linear infinite; }
  
    </style>
    
      <filter id="reactor-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="7.2" result="blur2" />
        <feMerge>
          <feMergeNode in="blur2" />
          <feMergeNode in="blur1" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    
    
      <filter id="reactor-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="8" stdDeviation="20" flood-color="#000000" flood-opacity="0.45" />
      </filter>
    
    
      <pattern id="reactor-grid" width="32" height="32" patternUnits="userSpaceOnUse">
        <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35" />
      </pattern>
    
    
      <linearGradient id="reactor-bg" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0b1120" />
        <stop offset="100%" stop-color="#040711" />
      </linearGradient>
    
  </defs>
  <rect x="10" y="10" width="780" height="260" rx="16" fill="#000000" fill-opacity="0.4" filter="url(#reactor-shadow)" />
  <rect x="10" y="10" width="780" height="260" rx="16" fill="url(#reactor-bg)" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 26 11 L 774 11" stroke="#a855f7" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" />
  <rect x="10" y="10" width="780" height="260" fill="url(#reactor-grid)" rx="16" />
  <text x="38" y="44" class="reactor-title">LANGUAGE FUSION REACTOR // MULTI-RING TECH CONDUIT</text>
  <text x="38" y="62" class="reactor-sub">PRIMARY CODEBASE METRICS & SYNTAX DISTRIBUTION MATRIX</text>
  <g >
    <circle cx="160" cy="150" r="74" fill="#0f172a" stroke="#334155" stroke-width="2" />
    <circle cx="160" cy="150" r="62" fill="none" stroke="#38bdf8" stroke-width="6" stroke-dasharray="140 100" stroke-linecap="round" class="ring-1" />
    <circle cx="160" cy="150" r="48" fill="none" stroke="#10b981" stroke-width="5" stroke-dasharray="90 80" stroke-linecap="round" class="ring-2" />
    <circle cx="160" cy="150" r="34" fill="none" stroke="#fbbf24" stroke-width="4" stroke-dasharray="60 60" stroke-linecap="round" class="ring-3" />
    <circle cx="160" cy="150" r="18" fill="#a855f7" filter="url(#reactor-glow)" />
    <circle cx="160" cy="150" r="6" fill="#ffffff" />
  </g>
  <g >
      <text x="300" y="100" class="lang-name">Flutter</text>
      <text x="740" y="100" class="lang-pct" fill="#02569B" text-anchor="end">undefined</text>
      <rect x="300" y="108" width="440" height="8" fill="#0f172a" stroke="#334155" rx="4" />
      <rect x="300" y="108" width="NaN" height="8" fill="#02569B" rx="4" />
    
      <text x="300" y="138" class="lang-name">Node.js</text>
      <text x="740" y="138" class="lang-pct" fill="#339933" text-anchor="end">undefined</text>
      <rect x="300" y="146" width="440" height="8" fill="#0f172a" stroke="#334155" rx="4" />
      <rect x="300" y="146" width="NaN" height="8" fill="#339933" rx="4" />
    
      <text x="300" y="176" class="lang-name">Python</text>
      <text x="740" y="176" class="lang-pct" fill="#3776AB" text-anchor="end">undefined</text>
      <rect x="300" y="184" width="440" height="8" fill="#0f172a" stroke="#334155" rx="4" />
      <rect x="300" y="184" width="NaN" height="8" fill="#3776AB" rx="4" />
    
      <text x="300" y="214" class="lang-name">React</text>
      <text x="740" y="214" class="lang-pct" fill="#61DAFB" text-anchor="end">undefined</text>
      <rect x="300" y="222" width="440" height="8" fill="#0f172a" stroke="#334155" rx="4" />
      <rect x="300" y="222" width="NaN" height="8" fill="#61DAFB" rx="4" />
    
      <text x="300" y="252" class="lang-name">SQL</text>
      <text x="740" y="252" class="lang-pct" fill="#336791" text-anchor="end">undefined</text>
      <rect x="300" y="260" width="440" height="8" fill="#0f172a" stroke="#334155" rx="4" />
      <rect x="300" y="260" width="NaN" height="8" fill="#336791" rx="4" />
    </g>
</svg>