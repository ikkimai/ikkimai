<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 150" width="800" height="150" fill="none">
  <defs>
    <style>

    .title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif; font-size: 18px; font-weight: 600; fill: #ffffff; letter-spacing: -0.2px; }
    .subtitle { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif; font-size: 13px; font-weight: 400; fill: #888888; letter-spacing: 0px; }
    .status-text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Inter', 'Helvetica Neue', sans-serif; font-size: 11px; font-weight: 500; fill: #a3a3a3; letter-spacing: 0.5px; text-transform: uppercase; }
    
    @keyframes loadProgress {
      0% { width: 0px; }
      100% { width: 140px; }
    }
    .progress-fill { animation: loadProgress 2s cubic-bezier(0.22, 1, 0.36, 1) forwards; }
  
    </style>
    
      <linearGradient id="premium-border" x1="0%" y1="0%" x2="100%" y2="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.15)" />
        <stop offset="100%" stop-color="rgba(255,255,255,0.03)" />
      </linearGradient>
    
    
      <radialGradient id="glow-accent" cx="0%" cy="0%" r="100%">
        <stop offset="0%" stop-color="rgba(255,255,255,0.08)" />
        <stop offset="100%" stop-color="rgba(0,0,0,0)" />
      </radialGradient>
    
  </defs>
  <rect x="0" y="0" width="800" height="150" fill="transparent" />
  <rect x="100" y="30" width="600" height="90" fill="#0A0A0A" rx="12" />
  <rect x="100" y="30" width="600" height="90" fill="url(#glow-accent)" rx="12" style="mix-blend-mode: screen;" />
  <rect x="100" y="30" width="600" height="90" fill="none" stroke="url(#premium-border)" stroke-width="1" rx="12" />
  <text x="130" y="70" class="title">Creative Mind Core</text>
  <text x="130" y="92" class="subtitle">Initializing workspace for Nicolas</text>
  <text x="510" y="64" class="status-text">SYSTEM ONLINE</text>
  <rect x="510" y="78" width="140" height="2" fill="#222222" rx="1" />
  <rect x="510" y="78" width="140" height="2" fill="#ffffff" rx="1" class="progress-fill" />
</svg>