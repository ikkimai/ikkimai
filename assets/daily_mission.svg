<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 120" width="800" height="120" fill="none">
  <defs>
    <style>

    .mission-title { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', 'Roboto', 'Helvetica Neue', sans-serif; font-size: 14px; font-weight: 700; fill: #38bdf8; letter-spacing: 2px; }
    .mission-quote { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'SF Pro Display', 'Inter', 'Roboto', 'Helvetica Neue', sans-serif; font-size: 15px; font-weight: 600; fill: #f8fafc; font-style: italic; }
    .mission-author { font-family: 'SF Mono', 'JetBrains Mono', 'Fira Code', 'Cascadia Code', 'Consolas', monospace; font-size: 11px; font-weight: 700; fill: #64748b; }
    
    @keyframes targetSpin {
      0% { transform: rotate(0deg); }
      100% { transform: rotate(360deg); }
    }
    .radar-icon { transform-origin: 50px 60px; animation: targetSpin 12s linear infinite; }
  
    </style>
    
      <filter id="mission-glow" x="-50%" y="-50%" width="200%" height="200%">
        <feGaussianBlur in="SourceGraphic" stdDeviation="4" result="blur1" />
        <feGaussianBlur in="SourceGraphic" stdDeviation="7.2" result="blur2" />
        <feMerge>
          <feMergeNode in="blur2" />
          <feMergeNode in="blur1" />
          <feMergeNode in="SourceGraphic" />
        </feMerge>
      </filter>
    
    
      <filter id="mission-shadow" x="-20%" y="-20%" width="140%" height="140%">
        <feDropShadow dx="0" dy="6" stdDeviation="16" flood-color="#000000" flood-opacity="0.4" />
      </filter>
    
    
      <pattern id="mission-grid" width="24" height="24" patternUnits="userSpaceOnUse">
        <path d="M 24 0 L 0 0 0 24" fill="none" stroke="#1e293b" stroke-width="1" stroke-opacity="0.35" />
      </pattern>
    
    
      <linearGradient id="mission-bg" x1="0%" y1="0%" x2="0%" y2="100%">
        <stop offset="0%" stop-color="#0b1120" />
        <stop offset="100%" stop-color="#040711" />
      </linearGradient>
    
  </defs>
  <rect x="10" y="10" width="780" height="100" rx="14" fill="#000000" fill-opacity="0.4" filter="url(#mission-shadow)" />
  <rect x="10" y="10" width="780" height="100" rx="14" fill="url(#mission-bg)" stroke="#1e293b" stroke-width="1.5" />
  <path d="M 24 11 L 776 11" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-opacity="0.85" />
  <rect x="10" y="10" width="780" height="100" fill="url(#mission-grid)" rx="14" />
  <g >
    <circle cx="50" cy="60" r="22" fill="#0f172a" stroke="#334155" stroke-width="1.5" />
    <circle cx="50" cy="60" r="16" fill="none" stroke="#38bdf8" stroke-width="1.5" stroke-dasharray="6 6" class="radar-icon" />
    <circle cx="50" cy="60" r="5" fill="#38bdf8" />
  </g>
  <text x="88" y="40" class="mission-title">DAILY OPERATIONAL DIRECTIVE // AI SYSTEM MISSION</text>
  <text x="88" y="64" class="mission-quote">"undefined"</text>
  <text x="88" y="86" class="mission-author">— Creative Mind OS Kernel</text>
</svg>