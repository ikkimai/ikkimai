name: Creative Mind OS Engine Update

on:
  schedule:
    # Run at 00:00 and 12:00 every day
    - cron: '0 */12 * * *'
  # Allow manual execution from the Actions tab
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Run Fetch Engine
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          PAT_TOKEN: ${{ secrets.PAT_TOKEN }}
        run: node scripts/fetchStats.js

      - name: Build Vector Dashboard
        run: node scripts/build.js

      - name: Commit and Push Changes
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git add assets/creative_mind_dashboard.svg api/github-data.json README.md
          git commit -m "chore(engine): auto-update dashboard telemetry [skip ci]" || echo "No changes to commit"
          git push
